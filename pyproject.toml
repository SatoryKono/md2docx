[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md2docx"
version = "0.1.0"
description = "Markdown → DOCX with GOST 7.32-2017 / A.docx styles (hexagonal)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
md2docx = "md2docx.adapters.inbound.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
md2docx = ["config/*.json"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
