[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md2docx"
version = "0.2.0"
description = "Markdown → DOCX with GOST 7.32-2017 / A.docx styles (hexagonal)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1.0",
    "mistune>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.8",
]

[project.scripts]
md2docx = "md2docx.adapters.inbound.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
md2docx = ["config/*.json"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
addopts = []

[tool.coverage.run]
source = ["md2docx"]
branch = true
omit = [
    "*/__main__.py",
]

[tool.coverage.report]
# line+branch: pytest --cov=md2docx --cov-branch --cov-report=term
fail_under = 70
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "test"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",
    "E402",  # package-internal imports after ALIGN constants in docx/*
]

[tool.mypy]
python_version = "3.11"
packages = ["md2docx"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "md2docx.domain.*",
    "md2docx.application.*",
]
disallow_untyped_defs = false
